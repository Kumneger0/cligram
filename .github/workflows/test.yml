name: Test and coverage

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    env:
      CGO_LDFLAGS_ALLOW: "(-Wl,.*|-v)"
      CGO_LDFLAGS: ${{ matrix.os == 'macos-latest' && '-v -Wl,-ld_classic' || '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Inspect CI toolchain (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "=== sw_vers ==="
          sw_vers
          echo "=== xcodebuild -version ==="
          xcodebuild -version
          echo "=== clang --version ==="
          clang --version
          echo "=== xcrun --find ld ==="
          xcrun --find ld
          echo "=== go version ==="
          go version
          echo "=== available Xcode versions ==="
          ls -ld /Applications/Xcode* || true

      - name: Download VoIP dependencies
        run: make deps-voip

      - name: Inspect static library (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "=== file ==="
          file ntg/lib/darwin_arm64/libntgcalls.a
          echo "=== ar -t ==="
          xcrun ar -t ntg/lib/darwin_arm64/libntgcalls.a | head -30
          echo "=== nm AsyncPromise ==="
          xcrun nm -arch arm64 -C ntg/lib/darwin_arm64/libntgcalls.a | grep -F 'AsyncPromise' | head -30
          echo "=== otool -l (head 100) ==="
          xcrun otool -l ntg/lib/darwin_arm64/libntgcalls.a | head -100
          echo "=== unwind sections ==="
          xcrun otool -l ntg/lib/darwin_arm64/libntgcalls.a | grep -A 5 -B 2 -i unwind | head -40 || true


      - name: Build unified cligram application
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: make build

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        run: bash <(curl -s https://codecov.io/bash)